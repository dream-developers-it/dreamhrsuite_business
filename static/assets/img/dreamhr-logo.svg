<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DreamHr-AI logo</title>
  <desc id="desc">A glowing cyan HR search mark with a person inside a magnifier.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#31566D"/>
      <stop offset="55%" stop-color="#203244"/>
      <stop offset="100%" stop-color="#111A26"/>
    </radialGradient>
    <linearGradient id="cyanStroke" x1="55" y1="38" x2="210" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9FFFF"/>
      <stop offset="38%" stop-color="#6AF8FF"/>
      <stop offset="100%" stop-color="#1BA9E8"/>
    </linearGradient>
    <linearGradient id="cyanFill" x1="75" y1="61" x2="156" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#AFFFFF"/>
      <stop offset="100%" stop-color="#36DDE7"/>
    </linearGradient>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.19 0 0 0 0 0.95 0 0 0 0 1 0 0 0 0.9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020713" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="250" height="250" rx="38" fill="url(#bgGlow)"/>
  <rect x="4" y="4" width="248" height="248" rx="37" stroke="#5D7588" stroke-opacity="0.32" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <path d="M169.5 165.5L214.5 210.5" stroke="url(#cyanStroke)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <g filter="url(#outerGlow)" stroke="url(#cyanStroke)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="116" cy="113" r="78" stroke-width="9"/>
    <path d="M59 107C61.7 80.8 84.5 60.5 111.5 60.5" stroke-width="8"/>
    <path d="M75 107C77.2 89.7 92.5 76.5 111.5 76.5" stroke-width="8"/>
    <path d="M99 54.5C107 51.9 116.8 51.4 126 53.4" stroke-width="8"/>
    <path d="M132.5 63.5C151.2 70.1 165.3 86.2 169.5 106" stroke-width="8"/>
    <path d="M148 84.5C154.8 90 159.6 97.7 161.5 106.5" stroke-width="8"/>
  </g>

  <g filter="url(#outerGlow)">
    <circle cx="123.5" cy="105" r="17.5" fill="url(#cyanFill)"/>
    <path d="M75 155L106 128.5L131 145.5L156 121" stroke="url(#cyanStroke)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 174L107 153.5L131.5 168L163 139" stroke="url(#cyanStroke)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>
</svg>
